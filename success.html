<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment received | Little Oak Kindergarten</title>
<style>
  :root { --bg:#f4f8f3; --ink:#15302b; --muted:#4f6b64; --leaf:#1f6b57; --accent:#f0a30a; --accent-ink:#2b1d00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1d1a; --ink:#e8f2ee; --muted:#9ab5ac; --leaf:#6fcfb0; --accent:#f5b83a; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; display:grid; place-items:center; min-height:100vh; padding:24px; box-sizing:border-box; }
  main { max-width:520px; }
  h1 { font-size:2rem; line-height:1.15; margin:0 0 12px; color:var(--leaf); }
  p { color:var(--muted); margin:0 0 20px; }
  a { display:inline-block; background:var(--accent); color:var(--accent-ink); padding:12px 20px; border-radius:10px; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1 id="h">Payment received</h1>
  <p id="p">Thank you. A receipt is on its way to your email.</p>
  <a href="/">Back to the school website</a>
</main>
<script>
  var t = new URLSearchParams(location.search).get('type');
  if (t === 'registration') {
    document.getElementById('h').textContent = 'Registration complete';
    document.getElementById('p').textContent = 'Thank you. We received your registration fee, and a receipt is on its way to your email. Next, pay the refundable enrollment deposit on our website to secure the place. We will also contact you about immunization records.';
  } else if (t === 'enrollment') {
    document.getElementById('h').textContent = 'Deposit received';
    document.getElementById('p').textContent = 'Thank you. Your enrollment deposit is paid and a receipt is on its way to your email. We will contact you to confirm your child\'s place.';
  } else if (t === 'tour') {
    document.getElementById('h').textContent = 'Tour fee received';
    document.getElementById('p').textContent = 'Thank you. We will email you a tour time. A receipt is on its way to your email.';
  }
</script>
</body>
</html>
